[project]
name = "weather-agent-backend"
version = "0.1.0"
description = "Data service and Claude agent backend for the ECMWF weather display prototype"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "earthkit-data>=1.2",
    "truststore>=0.10",
    "replit-object-storage>=1.0",
    "claude-agent-sdk>=0.1",
    "openai==3.42.0",
]
