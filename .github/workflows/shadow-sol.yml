# Shadow sweeps: the weather-highlights skill on GPT-6.1 Sol (OpenAI Agents API), at the same slots as
# production's Claude sweeps (03 and 15 UTC), for comparison only. Nothing is published, and the
# production server on Replit is not involved: see shadow/sol_runner.py and shadow/compare.py.
#
# GitHub can delay or drop scheduled jobs (none fired on 1 Nov 2026 between 00 and 06 UTC), so each
# slot has two times off the hour, and the second does nothing if the slot already has a run:
#   03:17 / 03:47 and 15:17 / 15:47 UTC   shadow sweep (once per slot)
#   05:13 / 06:43 and 17:13 / 18:43 UTC   compare runs with production's sweep, which appears
#                                          30-40 minutes after the slot (every job also compares
#                                          anything left over)
# Runs are kept for 14 days in the Actions cache, and each job uploads them as an artifact.
#
# Needs the repository secret OPENAI_API_KEY. Delete or disable this workflow to stop the trial.
name: Shadow sweep (Sol)

on:
  schedule:
    - cron: "17 3,15 * * *"    # shadow sweep
    - cron: "47 3,15 * * *"    # shadow sweep, if the first time was dropped
    - cron: "13 5,17 * * *"    # compare only
    - cron: "43 6,18 * * *"    # compare only, backup
  workflow_dispatch:
    inputs:
      sweep:
        description: "Run a shadow sweep (off = only compare earlier runs)"
        type: boolean
        default: true
      minutes:
        description: "Time limit for the shadow run, in minutes"
        default: "45"

permissions:
  contents: read

concurrency:
  group: shadow-sol
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SWEEP: ${{ (github.event_name == 'schedule' && contains(github.event.schedule, ' 3,15 ')) || inputs.sweep == true }}
      # a scheduled sweep runs once per slot; one started by hand always runs
      ONCE: ${{ github.event_name == 'schedule' && '3' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Restore earlier runs
        uses: actions/cache/restore@v4
        with:
          path: shadow/runs
          key: shadow-runs-${{ github.run_id }}
          restore-keys: shadow-runs-

      - name: Install
        run: |
          uv sync --frozen               # the backend itself, for re-validating drafts in staging
          cd shadow && uv sync --frozen
          mkdir -p runs

      - name: Check the key and model
        if: env.SWEEP == 'true'
        working-directory: shadow
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --frozen sol_runner.py probe

      - name: Shadow sweep
        if: env.SWEEP == 'true'
        working-directory: shadow
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --frozen sol_runner.py sweep --minutes "${{ inputs.minutes || '45' }}" --once-within "$ONCE"

      - name: Compare earlier runs with production
        if: always()
        working-directory: shadow
        run: uv run --frozen compare.py --pending

      - name: Keep 14 days of runs
        if: always()
        working-directory: shadow
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y%m%dT%H%MZ)
          for d in runs/*/; do [ -d "$d" ] && [ "$(basename "$d")" \< "$cutoff" ] && rm -rf "$d"; done; true

      - name: Save runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: shadow/runs
          key: shadow-runs-${{ github.run_id }}

      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-runs
          path: shadow/runs
          retention-days: 30
